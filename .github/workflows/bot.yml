name: BonnieBlue bot

# Cada corrida se queda ~5.5 h revisando la tabla cada minuto y, antes de terminar,
# lanza la siguiente. El cron es solo un respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Mandar el resumen ahora"
        type: boolean
        default: false

concurrency:
  group: bonnie-bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/Bogota
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # state.json (último puesto conocido, último resumen) se guarda entre corridas en la caché
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - if: inputs.force
        run: python bonnie_bot.py --force

      - id: bot
        run: python bonnie_bot.py --cloud-loop 330

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # Relevo: lanza la próxima corrida (queda en espera hasta que esta termine)
      - if: always() && steps.bot.outputs.ended != 'true'
        run: gh workflow run bot.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      # Cuando termina la leaderboard y ya se mandó el resultado final, se apaga solo
      - if: steps.bot.outputs.ended == 'true'
        run: gh workflow disable bot.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
